server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # everything runs in the browser: the server only hands out static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts a content hash in asset names, so they can be cached for good
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must always be fresh, or a new deploy would load old assets
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    server_tokens off;
}
