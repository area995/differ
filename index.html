<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ledger</title>
    <script>
      // applies a saved light/dark choice before the first paint (same key as src/ui/theme.ts)
      try {
        var theme = localStorage.getItem('ledger-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="page-head">
      <div>
        <h1>Ledger</h1>
        <p class="tagline">Confronto semantico JSON / YAML. I file restano nel browser.</p>
      </div>
      <div id="theme"></div>
    </header>
    <section id="options" class="options"></section>
    <section id="inputs" class="inputs"></section>
    <button id="add-file" class="add-file" type="button">+ Aggiungi file</button>
    <section id="result" class="result"></section>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
